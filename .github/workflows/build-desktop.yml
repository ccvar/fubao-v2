name: Build Desktop Clients

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Leave empty to use the desktop app version."
        required: false
        type: string
      notes:
        description: "Release notes stored in latest.json."
        required: false
        default: "福宝控制台自动构建发布包。"
        type: string
      publish:
        description: "Publish packages to ccvar/fubao-v2-releases."
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_REPOSITORY: ccvar/fubao-v2-releases

jobs:
  test:
    name: Verify desktop sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test Go engine
        working-directory: engine
        run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal
            os: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
            artifact: fubao-macos-universal
            bundle_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: fubao-windows-x64
            bundle_path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up Rust targets
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY required for signed desktop updates."
            exit 1
          fi

      - name: Build desktop client
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify Windows executables do not open a console
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          function Assert-GuiSubsystem([string] $Path) {
            if (-not (Test-Path $Path)) {
              throw "Windows executable not found: $Path"
            }

            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $optionalHeaderOffset = $peOffset + 24
            $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeaderOffset + 68)
            if ($subsystem -ne 2) {
              throw "Expected Windows GUI subsystem (2), got $subsystem for $Path"
            }
            Write-Host "Verified GUI subsystem: $Path"
          }

          Assert-GuiSubsystem "src-tauri/target/x86_64-pc-windows-msvc/release/fubao-desktop.exe"
          Assert-GuiSubsystem "src-tauri/binaries/fubao-engine-x86_64-pc-windows-msvc.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish packages repository
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release packages and manifest
        id: metadata
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          if [[ -n "${VERSION_INPUT}" ]]; then
            VERSION="${VERSION_INPUT#v}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          TAG="v${VERSION}"
          NOTES="${NOTES_INPUT:-福宝控制台自动构建发布包。}"

          MACOS_DMG_SOURCE="$(find release-assets -type f -name '*.dmg' -print -quit)"
          MACOS_UPDATE_SOURCE="$(find release-assets -type f -name '*.app.tar.gz' -print -quit)"
          MACOS_SIGNATURE_SOURCE="$(find release-assets -type f -name '*.app.tar.gz.sig' -print -quit)"
          WINDOWS_SOURCE="$(find release-assets -type f -name '*.exe' -print -quit)"
          WINDOWS_SIGNATURE_SOURCE="$(find release-assets -type f -name '*.exe.sig' -print -quit)"
          if [[ -z "$MACOS_DMG_SOURCE" || -z "$MACOS_UPDATE_SOURCE" || -z "$MACOS_SIGNATURE_SOURCE" || -z "$WINDOWS_SOURCE" || -z "$WINDOWS_SIGNATURE_SOURCE" ]]; then
            echo "macOS installer/updater and Windows installer/updater signatures are all required." >&2
            find release-assets -maxdepth 2 -type f -print >&2
            exit 1
          fi

          MACOS_DMG_FILE="fubao-console-${VERSION}-macos-universal.dmg"
          MACOS_UPDATE_FILE="fubao-console-${VERSION}-macos-universal.app.tar.gz"
          MACOS_SIGNATURE_FILE="${MACOS_UPDATE_FILE}.sig"
          WINDOWS_FILE="fubao-console-${VERSION}-windows-x64-setup.exe"
          WINDOWS_SIGNATURE_FILE="${WINDOWS_FILE}.sig"
          cp "$MACOS_DMG_SOURCE" "release-assets/$MACOS_DMG_FILE"
          cp "$MACOS_UPDATE_SOURCE" "release-assets/$MACOS_UPDATE_FILE"
          cp "$MACOS_SIGNATURE_SOURCE" "release-assets/$MACOS_SIGNATURE_FILE"
          cp "$WINDOWS_SOURCE" "release-assets/$WINDOWS_FILE"
          cp "$WINDOWS_SIGNATURE_SOURCE" "release-assets/$WINDOWS_SIGNATURE_FILE"

          export VERSION TAG NOTES MACOS_DMG_FILE MACOS_UPDATE_FILE MACOS_SIGNATURE_FILE WINDOWS_FILE WINDOWS_SIGNATURE_FILE
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = Path("release-assets")
          repository = os.environ["RELEASE_REPOSITORY"]
          tag = os.environ["TAG"]

          def package(filename: str, signature_filename: str) -> dict:
              return {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{filename}",
                  "signature": (assets / signature_filename).read_text(encoding="utf-8").strip(),
              }

          def legacy_package(filename: str) -> dict:
              path = assets / filename
              return {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{filename}",
                  "filename": filename,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }

          macos = package(os.environ["MACOS_UPDATE_FILE"], os.environ["MACOS_SIGNATURE_FILE"])
          windows = package(os.environ["WINDOWS_FILE"], os.environ["WINDOWS_SIGNATURE_FILE"])
          manifest = {
              "version": os.environ["VERSION"],
              "notes": os.environ["NOTES"],
              "force": False,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": macos,
                  "darwin-x86_64": macos,
                  "windows-x86_64": windows,
              },
              # Keep one transition release readable by the pre-Tauri updater in
              # 0.1.17. Tauri ignores these extra fields; old clients ignore the
              # new signed `platforms` object.
              "packages": {
                  "macos": legacy_package(os.environ["MACOS_DMG_FILE"]),
                  "windows": legacy_package(os.environ["WINDOWS_FILE"]),
              },
          }
          (assets / "latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "macos_dmg_file=$MACOS_DMG_FILE"
            echo "macos_update_file=$MACOS_UPDATE_FILE"
            echo "macos_signature_file=$MACOS_SIGNATURE_FILE"
            echo "windows_file=$WINDOWS_FILE"
            echo "windows_signature_file=$WINDOWS_SIGNATURE_FILE"
          } >> "$GITHUB_OUTPUT"
          cat release-assets/latest.json

      - name: Initialize packages repository
        env:
          RELEASE_TOKEN: ${{ secrets.FUBAO_V2_RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "Missing required secret: FUBAO_V2_RELEASES_TOKEN" >&2
            exit 1
          fi
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/${RELEASE_REPOSITORY}.git" release-repo
          cd release-repo
          git checkout -B main
          if [[ ! -f README.md ]]; then
            {
              printf '%s\n' '# 福宝控制台发布仓库'
              printf '\n'
              printf '%s\n' '此仓库用于托管客户端更新清单，安装包发布在 GitHub Releases。'
            } > README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: initialize releases repository"
            git push origin HEAD:main
          fi

      - name: Create or update packages release
        env:
          GH_TOKEN: ${{ secrets.FUBAO_V2_RELEASES_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Missing required secret: FUBAO_V2_RELEASES_TOKEN" >&2
            exit 1
          fi
          TAG="${{ steps.metadata.outputs.tag }}"
          NOTES="${RELEASE_NOTES:-福宝控制台自动构建发布包。}"
          NOTES_FILE="$(mktemp)"
          printf '%s\n' "$NOTES" > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"
          else
            gh release create "$TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "福宝控制台 $TAG" \
              --notes-file "$NOTES_FILE" \
              --draft
          fi

          gh release upload "$TAG" \
            "release-assets/${{ steps.metadata.outputs.macos_dmg_file }}" \
            "release-assets/${{ steps.metadata.outputs.macos_update_file }}" \
            "release-assets/${{ steps.metadata.outputs.macos_signature_file }}" \
            "release-assets/${{ steps.metadata.outputs.windows_file }}" \
            "release-assets/${{ steps.metadata.outputs.windows_signature_file }}" \
            release-assets/latest.json \
            --repo "$RELEASE_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --draft=false \
            --latest

      - name: Update latest manifest in packages repository
        shell: bash
        run: |
          set -euo pipefail
          cp release-assets/latest.json release-repo/latest.json
          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md latest.json
          if git diff --cached --quiet; then
            echo "latest.json unchanged"
          else
            git commit -m "release: update latest.json for ${{ steps.metadata.outputs.tag }}"
            git push origin HEAD:main
          fi
